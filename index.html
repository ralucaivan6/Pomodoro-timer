<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pomodoro Timer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 180px;
      background: transparent;
      color: #2c2c2b;
      font-family: Arial, sans-serif;
    }

    .pomodoro {
      width: min(100%, 220px);
      margin: 0 auto;
      padding: 12px;
      background: #fff;
      border: 1px solid #e6e5e3;
      border-radius: 12px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .title {
      font-weight: 700;
    }

    #mode {
      color: #7d7a75;
    }

    #time {
      margin-bottom: 8px;
      text-align: center;
      font-size: 40px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
    }

    .progress {
      height: 5px;
      margin-bottom: 10px;
      overflow: hidden;
      background: #e5f2fc;
      border-radius: 10px;
    }

    #progressBar {
      width: 100%;
      height: 100%;
      background: #2783de;
      transform-origin: left;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      min-height: 40px;
      border: 1px solid #e6e5e3;
      border-radius: 8px;
      background: #f9f8f7;
      color: #2c2c2b;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    button:hover {
      border-color: #2783de;
    }

    #startButton {
      border-color: #2783de;
      background: #2783de;
      color: white;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      margin-top: 9px;
      color: #7d7a75;
      font-size: 11px;
    }

    @media (prefers-color-scheme: dark) {
      body {
        color: white;
      }

      .pomodoro {
        background: #202020;
        border-color: rgba(255, 255, 255, 0.2);
      }

      button {
        background: #2a2a29;
        color: white;
        border-color: rgba(255, 255, 255, 0.2);
      }

      #mode,
      .footer {
        color: rgba(255, 255, 255, 0.65);
      }
    }
  </style>
</head>

<body>
  <main class="pomodoro">
    <div class="header">
      <span class="title">Pomodoro</span>
      <span id="mode">Focus</span>
    </div>

    <div id="time">25:00</div>

    <div class="progress">
      <div id="progressBar"></div>
    </div>

    <div class="buttons">
      <button id="startButton" type="button">Start</button>
      <button id="resetButton" type="button">Reset</button>
    </div>

    <div class="footer">
      <span id="session">Session 1</span>
      <span>25 / 5 min</span>
    </div>
  </main>

  <script>
    const FOCUS_TIME = 25 * 60;
    const BREAK_TIME = 5 * 60;

    let remainingTime = FOCUS_TIME;
    let totalTime = FOCUS_TIME;
    let sessionNumber = 1;
    let breakMode = false;
    let running = false;
    let timer = null;

    const timeDisplay = document.getElementById("time");
    const modeDisplay = document.getElementById("mode");
    const sessionDisplay = document.getElementById("session");
    const progressBar = document.getElementById("progressBar");
    const startButton = document.getElementById("startButton");
    const resetButton = document.getElementById("resetButton");

    function updateDisplay() {
      const minutes = Math.floor(remainingTime / 60);
      const seconds = remainingTime % 60;

      timeDisplay.textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");

      modeDisplay.textContent = breakMode ? "Break" : "Focus";
      sessionDisplay.textContent = `Session ${sessionNumber}`;
      startButton.textContent = running ? "Pause" : "Start";

      const progress = remainingTime / totalTime;
      progressBar.style.transform = `scaleX(${progress})`;

      document.title = `${timeDisplay.textContent} · Pomodoro`;
    }

    function changeMode() {
      breakMode = !breakMode;
      totalTime = breakMode ? BREAK_TIME : FOCUS_TIME;
      remainingTime = totalTime;

      if (!breakMode) {
        sessionNumber++;
      }

      updateDisplay();
    }

    function tick() {
      if (remainingTime > 0) {
        remainingTime--;
        updateDisplay();
      } else {
        changeMode();
      }
    }

    function startTimer() {
      running = true;
      timer = setInterval(tick, 1000);
      updateDisplay();
    }

    function pauseTimer() {
      running = false;
      clearInterval(timer);
      timer = null;
      updateDisplay();
    }

    startButton.addEventListener("click", () => {
      if (running) {
        pauseTimer();
      } else {
        startTimer();
      }
    });

    resetButton.addEventListener("click", () => {
      pauseTimer();

      breakMode = false;
      sessionNumber = 1;
      totalTime = FOCUS_TIME;
      remainingTime = FOCUS_TIME;

      updateDisplay();
    });

    updateDisplay();
  </script>
</body>
</html>


<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pomodoro Timer</title>

  <style>
    :root {
      --cream: #f5efe6;
      --cream-light: #fffaf4;
      --brown: #463a32;
      --muted: #96877b;
      --accent: #bd7d5b;
      --border: #e5d5c6;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-width: 200px;
      min-height: 200px;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      overflow: hidden;
      background: transparent;
      color: var(--brown);
      font-family: Arial, sans-serif;
    }

    .pomodoro {
      width: 100%;
      height: 100%;
      min-height: 200px;
      max-height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(14px, 5vw, 24px);
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--cream);
      text-align: center;
    }

    .modes {
      display: flex;
      gap: 6px;
      margin-bottom: clamp(12px, 4vw, 18px);
    }

    .mode {
      min-height: 34px;
      padding: 7px 12px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: clamp(11px, 3vw, 13px);
      font-weight: 600;
      cursor: pointer;
    }

    .mode.active {
      border-color: var(--border);
      background: var(--cream-light);
      color: var(--brown);
    }

    #time {
      margin: 0 0 clamp(14px, 4vw, 20px);
      font-size: clamp(48px, 22vw, 68px);
      font-weight: 700;
      letter-spacing: -4px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    button {
      min-width: 76px;
      min-height: 42px;
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--cream-light);
      color: var(--brown);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    button:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:focus-visible {
      outline: 3px solid rgba(189, 125, 91, 0.3);
      outline-offset: 2px;
    }

    #start {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    @media (max-width: 240px), (max-height: 220px) {
      body {
        padding: 5px;
      }

      .pomodoro {
        min-height: 190px;
        padding: 10px;
        border-radius: 16px;
      }

      .modes {
        margin-bottom: 10px;
      }

      .mode {
        min-height: 30px;
        padding: 5px 8px;
      }

      #time {
        margin-bottom: 12px;
        font-size: 46px;
      }

      button {
        min-width: 68px;
        min-height: 38px;
        padding: 7px 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      button {
        transition: none;
      }
    }

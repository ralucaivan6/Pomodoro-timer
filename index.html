<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#f8f0e3" />

  <title>Cream Pomodoro</title>

  <style>
    :root {
      --cream: #f8f0e3;
      --cream-light: #fffaf2;
      --cream-dark: #f1e5d2;
      --paper: rgba(255, 253, 248, 0.82);

      --text: #3d342d;
      --muted: #85786c;
      --border: rgba(103, 79, 58, 0.16);

      --accent: #bd744c;
      --accent-dark: #8c5136;
      --break: #93a689;

      --shadow:
        0 18px 45px rgba(121, 83, 48, 0.12),
        0 2px 7px rgba(121, 83, 48, 0.07);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 0;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(12px, 2.5vw, 28px);

      color: var(--text);
      background:
        radial-gradient(
          circle at 8% 8%,
          rgba(255, 255, 255, 0.75),
          transparent 32%
        ),
        radial-gradient(
          circle at 96% 92%,
          rgba(225, 196, 159, 0.25),
          transparent 34%
        ),
        var(--cream);

      font-family:
        ui-rounded,
        "SF Pro Rounded",
        "Segoe UI",
        system-ui,
        -apple-system,
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: min(100%, 760px);
      min-height: 400px;

      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(230px, 0.95fr);
      gap: clamp(18px, 4vw, 36px);

      padding: clamp(20px, 4vw, 38px);

      background: var(--paper);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;

      margin: 0 0 8px;

      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 24px;
      height: 2px;
      border-radius: 20px;
      background: var(--accent);
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 4vw, 39px);
      line-height: 1.03;
      letter-spacing: -0.045em;
    }

    .subtitle {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .mode-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 24px 0 16px;
    }

    .mode-tab,
    .button,
    .save-button {
      min-height: 44px;
      border: 1px solid transparent;
      border-radius: 13px;
      cursor: pointer;

      transition:
        transform 0.18s ease,
        background 0.18s ease,
        border-color 0.18s ease,
        color 0.18s ease,
        box-shadow 0.18s ease;
    }

    .mode-tab {
      padding: 9px 13px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.52);
      border-color: var(--border);
      font-size: 12px;
      font-weight: 750;
    }

    .mode-tab:hover,
    .mode-tab:focus-visible {
      color: var(--accent-dark);
      border-color: rgba(184, 113, 76, 0.42);
    }

    .mode-tab.active {
      color: white;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 5px 13px rgba(184, 113, 76, 0.22);
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(184, 113, 76, 0.36);
      outline-offset: 2px;
    }

    button:active {
      transform: translateY(1px) scale(0.99);
    }

    .timer-area {
      display: grid;
      place-items: center;
      padding: 2px 0 4px;
    }

    .timer-ring {
      position: relative;
      width: min(100%, 265px);
      aspect-ratio: 1;
    }

    .timer-ring svg {
      display: block;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-track,
    .ring-progress {
      fill: none;
      stroke-width: 11;
    }

    .ring-track {
      stroke: var(--cream-dark);
    }

    .ring-progress {
      stroke: var(--accent);
      stroke-linecap: round;

      transition:
        stroke-dashoffset 0.35s ease,
        stroke 0.25s ease;
    }

    .timer-center {
      position: absolute;
      inset: 0;

      display: grid;
      place-content: center;
      text-align: center;
    }

    .time {
      font-size: clamp(48px, 9vw, 72px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.07em;
      line-height: 0.96;
    }

    .status {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .controls {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1.25fr 1fr;
      gap: 8px;
      margin-top: 17px;
    }

    .button {
      padding: 11px 12px;
      font-size: 13px;
      font-weight: 800;
    }

    .button-secondary {
      color: var(--muted);
      background: transparent;
      border-color: var(--border);
    }

    .button-secondary:hover {
      color: var(--accent-dark);
      background: rgba(255, 255, 255, 0.72);
      border-color: rgba(184, 113, 76, 0.38);
    }

    .button-primary {
      color: var(--cream-light);
      background: var(--text);
      box-shadow: 0 5px 14px rgba(61, 52, 45, 0.16);
    }

    .button-primary:hover {
      background: var(--accent-dark);
    }

    .side {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .panel {
      padding: 16px;
      background: rgba(255, 255, 255, 0.42);
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    .panel-title {
      margin: 0 0 10px;

      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .task-input,
    .number-input {
      color: var(--text);
      background: rgba(255, 255, 255, 0.67);
      border: 1px solid var(--border);
    }

    .task-input {
      width: 100%;
      min-height: 45px;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 14px;
    }

    .task-input::placeholder {
      color: #aa9c8e;
    }

    .sessions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .session-dots {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border: 1px solid rgba(103, 79, 58, 0.1);
      border-radius: 50%;
      background: var(--cream-dark);
    }

    .dot.done {
      background: var(--accent);
      border-color: var(--accent);
    }

    .session-text {
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }

    .settings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .setting {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .setting label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .number-input {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border-radius: 10px;
    }

    .panel-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
    }

    .sound-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .sound-toggle input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    .save-button {
      width: 44px;
      padding: 0;

      display: inline-grid;
      place-items: center;

      color: var(--muted);
      background: transparent;
      border-color: var(--border);
    }

    .save-button:hover {
      color: var(--accent-dark);
      background: rgba(255, 255, 255, 0.72);
      border-color: rgba(184, 113, 76, 0.38);
    }

    .tip {
      margin-top: auto;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .tip strong {
      color: var(--accent-dark);
    }

    @media (max-width: 640px) {
      body {
        padding: 10px;
        place-items: start center;
      }

      .app {
        width: 100%;
        min-height: 0;
        grid-template-columns: 1fr;
        gap: 18px;
        padding: 20px;
        border-radius: 23px;
      }

      .main {
        gap: 8px;
      }

      .timer-ring {
        width: min(68vw, 265px);
      }

      .side {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: start;
      }

      .side .panel:first-child {
        grid-column: 1 / -1;
      }

      .tip {
        grid-column: 1 / -1;
        margin-top: 0;
      }
    }

    @media (max-width: 390px) {
      .app {
        padding: 16px;
      }

      .mode-tabs {
        margin-top: 18px;
      }

      .mode-tab {
        flex: 1;
        padding-inline: 8px;
      }

      .side {
        display: flex;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="app" aria-label="Pomodoro timer">
    <section class="main">
      <header>
        <p class="eyebrow">Study rhythm</p>
        <h1>Pomodoro timer</h1>
        <p class="subtitle">
          A calm space for focused work, one session at a time.
        </p>

        <nav class="mode-tabs" aria-label="Timer mode">
          <button class="mode-tab active" data-mode="focus" type="button">
            Focus
          </button>

          <button class="mode-tab" data-mode="short" type="button">
            Short break
          </button>

          <button class="mode-tab" data-mode="long" type="button">
            Long break
          </button>
        </nav>
      </header>

      <div class="timer-area">
        <div class="timer-ring" aria-live="polite">
          <svg viewBox="0 0 220 220" aria-hidden="true">
            <circle
              class="ring-track"
              cx="110"
              cy="110"
              r="92"
            ></circle>

            <circle
              class="ring-progress"
              cx="110"
              cy="110"
              r="92"
            ></circle>
          </svg>

          <div class="timer-center">
            <div class="time" id="time">25:00</div>
            <div class="status" id="status">Ready to focus</div>
          </div>
        </div>

        <div class="controls">
          <button
            class="button button-secondary"
            id="reset"
            type="button"
          >
            Reset
          </button>

          <button
            class="button button-primary"
            id="start"
            type="button"
          >
            Start focus
          </button>

          <button
            class="button button-secondary"
            id="skip"
            type="button"
          >
            Skip
          </button>
        </div>
      </div>
    </section>

    <aside class="side">
      <section class="panel">
        <p class="panel-title">What are you working on?</p>

        <input
          class="task-input"
          id="task"
          type="text"
          maxlength="80"
          placeholder="e.g. Review anatomy notes"
          aria-label="Current task"
        />
      </section>

      <section class="panel">
        <p class="panel-title">Today's rhythm</p>

        <div
          class="sessions"
          id="session-information"
          aria-label="Completed focus sessions"
        >
          <div class="session-dots" id="session-dots"></div>
          <span class="session-text" id="session-text">
            0 of 4 sessions
          </span>
        </div>
      </section>

      <section class="panel">
        <p class="panel-title">Tune it to you</p>

        <div class="settings">
          <div class="setting">
            <label for="focus-minutes">Focus · min</label>
            <input
              class="number-input"
              id="focus-minutes"
              type="number"
              min="1"
              max="90"
              inputmode="numeric"
            />
          </div>

          <div class="setting">
            <label for="break-minutes">Short · min</label>
            <input
              class="number-input"
              id="break-minutes"
              type="number"
              min="1"
              max="30"
              inputmode="numeric"
            />
          </div>
        </div>

        <div class="panel-footer">
          <label class="sound-toggle">
            <input id="sound" type="checkbox" checked />
            Gentle sound
          </label>

          <button
            class="save-button"
            id="save-settings"
            type="button"
            aria-label="Save timer settings"
            title="Save settings"
          >
            ✓
          </button>
        </div>
      </section>

      <p class="tip">
        <strong>Tip:</strong> press <strong>Space</strong> to start or pause.
        Your task and settings stay on this device.
      </p>
    </aside>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "cream-pomodoro-v1";

      const elements = {
        time: document.getElementById("time"),
        status: document.getElementById("status"),
        start: document.getElementById("start"),
        reset: document.getElementById("reset"),
        skip: document.getElementById("skip"),
        task: document.getElementById("task"),
        sound: document.getElementById("sound"),
        focusMinutes: document.getElementById("focus-minutes"),
        breakMinutes: document.getElementById("break-minutes"),
        saveSettings: document.getElementById("save-settings"),
        sessionDots: document.getElementById("session-dots"),
        sessionText: document.getElementById("session-text"),
        sessionInformation: document.getElementById("session-information"),
        ring: document.querySelector(".ring-progress")
      };

      const defaultDurations = {
        focus: 25,
        short: 5,
        long: 15
      };

      let savedState = {};

      try {
        savedState = JSON.parse(
          localStorage.getItem(STORAGE_KEY) || "{}"
        );
      } catch {
        savedState = {};
      }

      const durations = {
        ...defaultDurations,
        ...(savedState.durations || {})
      };

      const state = {
        mode: savedState.mode || "focus",
        seconds:
          savedState.seconds ??
          durations[savedState.mode || "focus"] * 60,
        running: false,
        sessions: Number(savedState.sessions) || 0,
        task: savedState.task || "",
        sound: savedState.sound !== false,
        durations
      };

      const radius = 92;
      const circumference = 2 * Math.PI * radius;

      elements.ring.style.strokeDasharray = circumference;
      elements.task.value = state.task;
      elements.sound.checked = state.sound;
      elements.focusMinutes.value = state.durations.focus;
      elements.breakMinutes.value = state.durations.short;

      let interval = null;

      function saveState() {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            mode: state.mode,
            seconds: state.seconds,
            sessions: state.sessions,
            task: state.task,
            sound: state.sound,
            durations: state.durations
          })
        );
      }

      function totalSeconds() {
        return state.durations[state.mode] * 60;
      }

      function modeLabel(mode) {
        if (mode === "focus") return "focus";
        if (mode === "short") return "short break";
        return "long break";
      }

      function renderSessions() {
        elements.sessionDots.innerHTML = "";

        const currentCycle = state.sessions % 4;

        for (let index = 0; index < 4; index++) {
          const dot = document.createElement("span");

          dot.className =
            "dot" + (index < currentCycle ? " done" : "");

          dot.setAttribute("aria-hidden", "true");
          elements.sessionDots.appendChild(dot);
        }

        elements.sessionText.textContent =
          `${currentCycle} of 4 sessions`;

        elements.sessionInformation.setAttribute(
          "aria-label",
          `${currentCycle} of 4 focus sessions completed`
        );
      }

      function render() {
        const minutes = Math.floor(state.seconds / 60)
          .toString()
          .padStart(2, "0");

        const seconds = (state.seconds % 60)
          .toString()
          .padStart(2, "0");

        elements.time.textContent = `${minutes}:${seconds}`;

        const progress = Math.max(
          0,
          Math.min(1, state.seconds / totalSeconds())
        );

        elements.ring.style.strokeDashoffset =
          circumference * (1 - progress);

        elements.ring.style.stroke =
          state.mode === "focus"
            ? "var(--accent)"
            : "var(--break)";

        document.querySelectorAll(".mode-tab").forEach((button) => {
          button.classList.toggle(
            "active",
            button.dataset.mode === state.mode
          );
        });

        if (state.running) {
          elements.status.textContent =
            `In your ${modeLabel(state.mode)}`;
        } else if (state.seconds === totalSeconds()) {
          elements.status.textContent =
            `Ready to ${modeLabel(state.mode)}`;
        } else {
          elements.status.textContent = "Paused";
        }

        elements.start.textContent = state.running
          ? "Pause"
          : `Start ${modeLabel(state.mode)}`;

        document.title =
          `${minutes}:${seconds} · Cream Pomodoro`;

        renderSessions();
      }

      function stopInterval() {
        if (interval) {
          window.clearInterval(interval);
        }

        interval = null;
      }

      function setMode(mode) {
        stopInterval();

        state.mode = mode;
        state.seconds = state.durations[mode] * 60;
        state.running = false;

        saveState();
        render();
      }

      function playCompletionSound() {
        if (!state.sound) return;

        try {
          const AudioContext =
            window.AudioContext || window.webkitAudioContext;

          const context = new AudioContext();

          [0, 0.16, 0.32].forEach((delay, index) => {
            const oscillator = context.createOscillator();
            const gain = context.createGain();

            oscillator.frequency.value =
              index === 1 ? 660 : 520;

            gain.gain.setValueAtTime(
              0.0001,
              context.currentTime + delay
            );

            gain.gain.exponentialRampToValueAtTime(
              0.12,
              context.currentTime + delay + 0.02
            );

            gain.gain.exponentialRampToValueAtTime(
              0.0001,
              context.currentTime + delay + 0.13
            );

            oscillator.connect(gain);
            gain.connect(context.destination);

            oscillator.start(context.currentTime + delay);
            oscillator.stop(context.currentTime + delay + 0.14);
          });
        } catch {
          // The timer still works if audio is unavailable.
        }
      }

      function moveToNextMode() {
        if (state.mode === "focus") {
          state.sessions += 1;

          state.mode =
            state.sessions % 4 === 0
              ? "long"
              : "short";
        } else {
          state.mode = "focus";
        }

        state.seconds = state.durations[state.mode] * 60;
      }

      function finishTimer() {
        stopInterval();

        state.running = false;

        playCompletionSound();
        moveToNextMode();
        saveState();
        render();
      }

      function toggleTimer() {
        state.running = !state.running;

        if (state.running) {
          interval = window.setInterval(() => {
            if (state.seconds <= 1) {
              finishTimer();
              return;
            }

            state.seconds -= 1;
            saveState();
            render();
          }, 1000);
        } else {
          stopInterval();
        }

        saveState();
        render();
      }

      function resetTimer() {
        stopInterval();

        state.running = false;
        state.seconds = totalSeconds();

        saveState();
        render();
      }

      function skipTimer() {
        stopInterval();

        state.running = false;

        moveToNextMode();
        saveState();
        render();
      }

      function saveSettings() {
        const focusMinutes = Math.max(
          1,
          Math.min(
            90,
            Number(elements.focusMinutes.value) ||
              defaultDurations.focus
          )
        );

        const breakMinutes = Math.max(
          1,
          Math.min(
            30,
            Number(elements.breakMinutes.value) ||
              defaultDurations.short
          )
        );

        state.durations.focus = focusMinutes;
        state.durations.short = breakMinutes;

        elements.focusMinutes.value = focusMinutes;
        elements.breakMinutes.value = breakMinutes;

        if (!state.running) {
          state.seconds = totalSeconds();
        }

        saveState();
        render();
      }

      document
        .querySelectorAll(".mode-tab")
        .forEach((button) => {
          button.addEventListener("click", () => {
            setMode(button.dataset.mode);
          });
        });

      elements.start.addEventListener("click", toggleTimer);
      elements.reset.addEventListener("click", resetTimer);
      elements.skip.addEventListener("click", skipTimer);
      elements.saveSettings.addEventListener("click", saveSettings);

      elements.task.addEventListener("input", () => {
        state.task = elements.task.value;
        saveState();
      });

      elements.sound.addEventListener("change", () => {
        state.sound = elements.sound.checked;
        saveState();
      });

      document.addEventListener("keydown", (event) => {
        const userIsTyping =
          document.activeElement?.tagName === "INPUT";

        if (event.code === "Space" && !userIsTyping) {
          event.preventDefault();
          toggleTimer();
        }
      });

      render();
    })();
  </script>
</body>
</html>

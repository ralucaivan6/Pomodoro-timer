<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#f8f0e3" />

  <title>Cream Pomodoro</title>

  <style>
    :root {
      --cream: #f8f0e3;
      --cream-light: #fffaf2;
      --cream-dark: #f1e5d2;
      --paper: rgba(255, 253, 248, 0.82);

      --text: #3d342d;
      --muted: #85786c;
      --border: rgba(103, 79, 58, 0.16);

      --accent: #bd744c;
      --accent-dark: #8c5136;
      --break: #93a689;

      --shadow:
        0 18px 45px rgba(121, 83, 48, 0.12),
        0 2px 7px rgba(121, 83, 48, 0.07);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 0;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(12px, 2.5vw, 28px);

      color: var(--text);
      background:
        radial-gradient(
          circle at 8% 8%,
          rgba(255, 255, 255, 0.75),
          transparent 32%
        ),
        radial-gradient(
          circle at 96% 92%,
          rgba(225, 196, 159, 0.25),
          transparent 34%
        ),
        var(--cream);

      font-family:
        ui-rounded,
        "SF Pro Rounded",
        "Segoe UI",
        system-ui,
        -apple-system,
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: min(100%, 760px);
      min-height: 400px;

      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(230px, 0.95fr);
      gap: clamp(18px, 4vw, 36px);

      padding: clamp(20px, 4vw, 38px);

      background: var(--paper);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;

      margin: 0 0 8px;

      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 24px;
      height: 2px;
      border-radius: 20px;
      background: var(--accent);
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 4vw, 39px);
      line-height: 1.03;
      letter-spacing: -0.045em;
    }

    .subtitle {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .mode-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 24px 0 16px;
    }

    .mode-tab,
    .button,
    .save-button {
      min-height: 44px;
      border: 1px solid transparent;
      border-radius: 13px;
      cursor: pointer;

      transition:
        transform 0.18s ease,
        background 0.18s ease,
        border-color 0.18s ease,
        color 0.18s ease,
        box-shadow 0.18s ease;
    }

    .mode-tab {
      padding: 9px 13px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.52);
      border-color: var(--border);
      font-size: 12px;
      font-weight: 750;
    }

    .mode-tab:hover,
    .mode-tab:focus-visible {
      color: var(--accent-dark);
      border-color: rgba(184, 113, 76, 0.42);
    }

    .mode-tab.active {
      color: white;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 5px 13px rgba(184, 113, 76, 0.22);
    }
